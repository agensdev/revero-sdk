[package]
name = "revero"
version = "0.1.0"
edition = "2021"
description = "Typed Rust SDK for the Revero Public API"
license = "Apache-2.0"
repository = "https://github.com/agensdev/revero-sdk"
documentation = "https://docs.rs/revero"
homepage = "https://docs.revero.no"
readme = "README.md"
keywords = ["meetings", "recording", "transcription", "sdk"]
categories = ["api-bindings"]
publish = ["crates-io"]
include = ["src/**", "Cargo.toml", "README.md", "CHANGELOG.md", "LICENSE"]

[lib]
doctest = false

[dependencies]
bytes = "1.0"
chrono = { version = "0.4", features = ["serde"] }
futures = "0.3"
reqwest = { version = "0.12", features = ["json", "stream", "gzip", "rustls-tls"], default-features = false }
hmac = "0.12"
httpdate = "1.0"
sha2 = "0.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
tokio = { version = "1.0", features = ["full"] }

[dev-dependencies]
axum = "0.8"
base64 = "0.22"
ctor = "0.2"
tokio-test = "0.4"
